# PC'de (Windows + Docker Desktop + WSL2) çalışan ana yığın.
# Hetzner'a yalnızca apps/watcher gider — bkz. deploy/sunucu-kurulum.md

# Proje adı SABİT: aynı yığın hem elle (bu klasörden) hem de self-hosted
# runner'ın kendi çalışma klasöründen yönetiliyor. Ad dizinden türetilseydi
# iki AYRI proje olur, ikisi de aynı container adlarını isterdi ve deploy
# "container name already in use" ile çakışırdı.
name: cry

services:
  db:
    image: postgres:17-alpine
    container_name: cry-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Dışarı açık DEĞİL; yalnızca localhost'tan (DBeaver) erişilir.
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      # ADLANDIRILMIŞ volume — verisi WSL2'nin ext4'ünde durur.
      # /mnt/c altına bind mount YAPMA: 5-10 kat yavaşlar.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cry-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    # Yalnızca BU MAKİNEYE yayınlanır (Postgres'teki 127.0.0.1:15432 gibi):
    # yerel dev sunucusu (3005) kuyruğa ulaşabilsin diye (kullanıcı kararı
    # 2026-09-15). Önce hiç yayınlanmıyordu ve 3005'ten gönderilen bir devam
    # isteği koşuyu "kuyrukta"da takılı bırakmıştı. Dışarıya AÇIK DEĞİL.
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: cry-web
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    # 127.0.0.1: ÖNEKİ KOYMA — WireGuard tünelinden (10.99.0.2) erişilmeli.
    ports:
      - "1337:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: cry-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Blok indeksi (görev 11). Motor kararı ve ölçümü: docs/yol-haritasi-blok-indeks.md §1.
  # Ücretli olan ClickHouse CLOUD'dur; sunucunun kendisi Apache 2.0 ve kendi makinede ücretsiz.
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: cry-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-cry}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-cry}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD gerekli}
      # Varsayılan 'default' kullanıcısı PAROLASIZ gelir; kapatılmazsa tünelden parolasız giriş olur.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    # 8123 = HTTP. Uzaktaki site WireGuard üzerinden bağlanacağı için 127.0.0.1'e KİTLENMEZ;
    # web'in 1337'siyle aynı desen: yayınla, Windows güvenlik duvarında 10.99.0.0/24 ile sınırla
    # (kural: cry-clickhouse-wg). 10.99.0.2'ye bağlamak da denenebilirdi ama tünel kapalıyken
    # konteyner hiç açılmazdı.
    ports:
      - "18123:8123"
    volumes:
      # ADLANDIRILMIŞ volume — Postgres'inkiyle aynı gerekçe, ama burada bir ZORUNLULUK:
      # ÖLÇÜLDÜ (2026-09-16) — Windows klasörünü bağlamak ClickHouse'ta ÇALIŞMIYOR. Sunucu parçayı
      # önce `tmp_insert_…` diye yazıp sonra rename ediyor ve 9p dosya sistemi bunu reddediyor:
      # "filesystem error: in rename: Permission denied". İlk INSERT'te HTTP 500. Hız da düşük
      # (bağlama 334 MB/s yazma ⟷ WSL diski 2,5 GB/s).
      # Verinin D:'de olması Docker Desktop'ın DİSK İMAJI konumuyla sağlanır
      # (Settings → Resources → Advanced → Disk image location → D:\Docker), bu volume'la değil.
      - chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
  chdata:
