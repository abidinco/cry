# PC'de (Windows + Docker Desktop + WSL2) çalışan ana yığın.
# Hetzner'a yalnızca apps/watcher gider — bkz. docs/deploy.md
services:
  db:
    image: postgres:17-alpine
    container_name: cry-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Dışarı açık DEĞİL; yalnızca localhost'tan (DBeaver) erişilir.
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      # ADLANDIRILMIŞ volume — verisi WSL2'nin ext4'ünde durur.
      # /mnt/c altına bind mount YAPMA: 5-10 kat yavaşlar.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cry-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    # Port YAYINLANMIYOR — yalnızca Docker ağı içinden erişilir.
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: cry-web
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    # 127.0.0.1: ÖNEKİ KOYMA — WireGuard tünelinden (10.99.0.2) erişilmeli.
    ports:
      - "1337:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: cry-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
