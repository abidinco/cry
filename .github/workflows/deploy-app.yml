name: deploy-app

# Ana yığın EVDEKİ makinede çalışıyor; oraya buluttan SSH ile girilemez
# (ev tarafında hiçbir port açık değil, tünel tek yönlü kuruluyor). Bu yüzden
# dağıtımı PC'nin KENDİSİNE kurulu bir self-hosted runner yapar: iş kuyruktan
# çekilir, makinenin dışarı açılması gerekmez.
#
# Adımlar PowerShell ile yazıldı, `shell: bash` ile DEĞİL: Windows'ta runner
# `bash`i PATH'ten çözüyor ve orada ilk sırada WSL'in bash'i duruyor
# (C:\WINDOWS\system32\bash.EXE). WSL içinde C: sürücüsü /mnt/c altındadır,
# yani Windows yolları sessizce bulunamaz.
on:
  push:
    branches: [main]
    paths-ignore:
      - "apps/watcher/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: deploy-app
  cancel-in-progress: false

defaults:
  run:
    shell: powershell

jobs:
  deploy:
    runs-on: [self-hosted, windows, cry-pc]
    steps:
      - uses: actions/checkout@v4

      - name: Ortam dosyasını yerine koy
        env:
          # Runner depoyu KENDİ çalışma klasörüne açıyor; .env orada olamaz
          # (depo public, dosya gitignore'da). İki kaynak var ve sırayla
          # denenir: makinedeki sabit dosya, sonra CRY_ENV secret'ı.
          CRY_ENV_FILE: ${{ vars.CRY_ENV_FILE || 'C:\srv\cry\.env' }}
          CRY_ENV: ${{ secrets.CRY_ENV }}
        run: |
          # Tani: hangi kimlikle kosuyoruz ve o kimlik neyi goruyor. Dosyaya
          # da yazilir, cunku is log'u yuklendikten sonra makinede kalmiyor.
          $tani = @()
          $tani += "whoami       : " + (whoami)
          $tani += "CRY_ENV_FILE : '$($env:CRY_ENV_FILE)'"
          $tani += "CRY_ENV var  : " + [bool]$env:CRY_ENV
          foreach ($y in "C:\srv", "C:\srv\cry", $env:CRY_ENV_FILE) {
            $tani += "$y -> $(Test-Path -LiteralPath $y)"
          }
          $tani += "--- icacls C:\srv ---"
          $tani += (icacls "C:\srv" 2>&1 | Out-String)
          $tani | ForEach-Object { Write-Host $_ }
          $tani | Set-Content "tani.txt" -Encoding UTF8

          if (Test-Path -LiteralPath $env:CRY_ENV_FILE) {
            Copy-Item -LiteralPath $env:CRY_ENV_FILE ".env" -Force
            Write-Host "OK: .env dosyadan alindi"
          } elseif ($env:CRY_ENV) {
            # Secret satirlari CRLF ile gelebilir; Postgres parolasinin sonuna
            # gorunmez bir karakter yapismasi "sifre yanlis" diye geri doner.
            ($env:CRY_ENV -replace "`r`n", "`n") | Set-Content ".env" -Encoding ASCII -NoNewline
            Write-Host "OK: .env secret'tan yazildi"
          } else {
            Write-Host "HATA: ne dosya ne secret bulundu"
            exit 1
          }

      - name: Docker ayakta mı
        run: |
          docker version --format '{{.Server.Version}}'
          if ($LASTEXITCODE -ne 0) {
            Write-Host "HATA: Docker motoruna ulasilamiyor (Docker Desktop kapali olabilir)"
            exit 1
          }

      - name: Derle ve ayağa kaldır
        run: |
          docker compose build
          if ($LASTEXITCODE -ne 0) { exit 1 }
          docker compose up -d
          if ($LASTEXITCODE -ne 0) { exit 1 }
          docker image prune -f

      - name: Migration
        run: |
          # Migration WORKER imajından koşar: web imajı standalone çıktı
          # taşıyor ve içinde prisma CLI yok.
          docker compose run --rm worker npx prisma migrate deploy --schema packages/db/prisma/schema.prisma
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Seed
        run: |
          # Idempotent: roller upsert edilir, kullanici zaten varsa dokunulmaz.
          docker compose run --rm worker npm run seed --workspace @cry/db
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Sağlık kontrolü
        run: |
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $y = Invoke-WebRequest -Uri "http://127.0.0.1:1337/saglik" -UseBasicParsing -TimeoutSec 5
              if ($y.StatusCode -eq 200) { Write-Host "OK: uygulama ayakta"; exit 0 }
            } catch { }
            Start-Sleep -Seconds 2
          }
          Write-Host "HATA: /saglik 60 saniyede cevap vermedi"
          docker compose logs --tail 50 web
          exit 1
